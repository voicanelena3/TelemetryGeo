server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS pentru proxy (rezolvare la runtime, ca nginx sa porneasca si fara internet)
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Rescrie URL-urile Sentinel Hub din JS catre proxy-ul local (/sentinel-hub),
    # astfel browserul face cereri same-origin si nu mai e nevoie de extensia CORS.
    # Codul sursa ramane neschimbat, deci Live Server functioneaza ca inainte.
    location /js/ {
        sub_filter_types application/javascript text/javascript;
        sub_filter 'https://services.sentinel-hub.com' '/sentinel-hub';
        sub_filter_once off;
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy catre API-ul Sentinel Hub
    location /sentinel-hub/ {
        set $sh_upstream services.sentinel-hub.com;
        rewrite ^/sentinel-hub/(.*)$ /$1 break;
        proxy_pass https://$sh_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host $sh_upstream;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
